
name: Build Liquid Glass for iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iPhone
        run: |
          xcodebuild \
            -project LiquidGlassTest.xcodeproj \
            -scheme LiquidGlassTest \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned app
        run: |
          mkdir -p output
          cd build/Build/Products/Debug-iphoneos
          zip -r "$GITHUB_WORKSPACE/output/LiquidGlassTest-unsigned.zip" LiquidGlassTest.app

      - name: Upload iPhone build
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTest-iPhone-unsigned
          path: output/LiquidGlassTest-unsigned.zip
          if-no-files-found: error
          retention-days: 7
