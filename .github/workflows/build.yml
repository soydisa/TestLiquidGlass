
name: Build Liquid Glass for iPhone

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build for physical iPhone
        run: |
          xcodebuild \
            -project LiquidGlassTest.xcodeproj \
            -scheme LiquidGlassTest \
            -configuration Debug \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package unsigned IPA
        run: |
          mkdir -p output/Payload
          cp -R build/Build/Products/Debug-iphoneos/LiquidGlassTest.app output/Payload/
          cd output
          zip -r LiquidGlassTest-unsigned.ipa Payload

      - name: Upload iPhone IPA
        uses: actions/upload-artifact@v4
        with:
          name: LiquidGlassTest-unsigned-IPA
          path: output/LiquidGlassTest-unsigned.ipa
          if-no-files-found: error
          retention-days: 7